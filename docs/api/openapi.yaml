  "components": {
    "schemas": {
      "Answer": {
        "properties": {
          "question_id": {
            "type": "string",
            "format": "uuid",
            "title": "Question Id"
          },
          "action": {
            "type": "string",
            "enum": [
              "answer",
              "approve",
              "decline"
            ],
            "title": "Action"
          },
          "text": {
            "type": "string",
            "maxLength": 4000,
            "title": "Text",
            "default": ""
          }
        },
        "type": "object",
        "required": [
          "question_id",
          "action"
        ],
        "title": "Answer"
      },
      "BatchInput": {
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid",
            "title": "Id"
          },
          "summary": {
            "type": "string",
            "maxLength": 2000,
            "minLength": 1,
            "title": "Summary"
          },
          "questions": {
            "items": {
              "$ref": "#/components/schemas/QuestionInput"
            },
            "type": "array",
            "maxItems": 20,
            "minItems": 1,
            "title": "Questions"
          }
        },
        "type": "object",
        "required": [
          "id",
          "summary",
          "questions"
        ],
        "title": "BatchInput"
      },
      "DecisionInput": {
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid",
            "title": "Id"
          },
          "answers": {
            "items": {
              "$ref": "#/components/schemas/Answer"
            },
            "type": "array",
            "maxItems": 20,
            "minItems": 1,
            "title": "Answers"
          }
        },
        "type": "object",
        "required": [
          "id",
          "answers"
        ],
        "title": "DecisionInput"
      },
      "DeviceInput": {
        "properties": {
          "token": {
            "type": "string",
            "pattern": "^[a-f0-9]{32,512}$",
            "title": "Token"
          }
        },
        "type": "object",
        "required": [
          "token"
        ],
        "title": "DeviceInput"
      },
      "HTTPValidationError": {
        "properties": {
          "detail": {
            "items": {
              "$ref": "#/components/schemas/ValidationError"
            },
            "type": "array",
            "title": "Detail"
          }
        },
        "type": "object",
        "title": "HTTPValidationError"
      },
      "ModeInput": {
        "properties": {
          "mode": {
            "type": "string",
            "enum": [
              "interactive",
              "autonomous"
            ],
            "title": "Mode"
          }
        },
        "type": "object",
        "required": [
          "mode"
        ],
        "title": "ModeInput"
      },
      "QuestionInput": {
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid",
            "title": "Id"
          },
          "prompt": {
            "type": "string",
            "maxLength": 2000,
            "minLength": 1,
            "title": "Prompt"
          }
        },
        "type": "object",
        "required": [
          "id",
          "prompt"
        ],
        "title": "QuestionInput"
      },
      "SessionInput": {
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid",
            "title": "Id"
          },
          "project": {
            "type": "string",
            "maxLength": 160,
            "minLength": 1,
            "title": "Project"
          },
          "mode": {
            "type": "string",
            "enum": [
              "interactive",
              "autonomous"
            ],
            "title": "Mode",
            "default": "interactive"
          }
        },
        "type": "object",
        "required": [
          "id",
          "project"
        ],
        "title": "SessionInput"
      },
      "StatusInput": {
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid",
            "title": "Id"
          },
          "kind": {
            "type": "string",
            "enum": [
              "progress",
              "complete",
              "error"
            ],
            "title": "Kind"
          }
        },
        "type": "object",
        "required": [
          "id",
          "kind"
        ],
        "title": "StatusInput"
      },
      "ValidationError": {
        "properties": {
          "loc": {
            "items": {
              "anyOf": [
                {
                  "type": "string"
                },
                {
                  "type": "integer"
                }
              ]
            },
            "type": "array",
            "title": "Location"
          },
          "msg": {
            "type": "string",
            "title": "Message"
          },
          "type": {
            "type": "string",
            "title": "Error Type"
          },
          "input": {
            "title": "Input"
          },
          "ctx": {
            "type": "object",
            "title": "Context"
          }
        },
        "type": "object",
        "required": [
          "loc",
          "msg",
          "type"
        ],
        "title": "ValidationError"
      }
    },
    "securitySchemes": {
      "AgentToken": {
        "type": "http",
        "scheme": "bearer"
      },
      "UserToken": {
        "type": "http",
        "scheme": "bearer"
      }
    }
  }
}
